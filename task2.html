<html>
    <head>
        <title>Task 2</title>
        <style>
            #area{
                width: 300px;
            }
            .inp{
                width: 95%;
            }
            #btn{
                width:70     px;
                height:30px;
            }
        </style>
    </head>
    <body>
        <form>
            <fieldset id="area">
                <legend><b>User Personal Information</b></legend>
                <label for="name">Enter Your full name:</label><br>
                <input type="text" id="name" class="inp" required><br><br>
                <label for="email">Enter Your Email:</label><br>
                <input type="email" id="email" class="inp" required><br><br>
                <label for="password">Enter Your Password:</label><br>
                <input type="password" id="password" class="inp" required><br><br>
                <label for="confirm_password">Confirm Your Password:</label><br>
                <input type="password" id="confirm_password" class="inp" required><br><br>
                <label for="gender">Enter your Gender:</label><br>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label><br><br>
                <label for="dob">Enter Your Date of Birth:</label><br>
                <input type="date" id="dob" class="inp" required><br><br>
                
                <label for="address">Enter Your Address:</label><br>
                <textarea id="address" class="inp" required></textarea><br><br>

                <input type="submit" value="Submit" id="btn">

            </fieldset>
        </form>
    </body>
</html>
